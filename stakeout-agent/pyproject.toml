[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stakeout-agent"
version = "0.0.10"
description = "Drop-in observability for LangGraph and CrewAI — captures every run, node, tool call, token count, prompt, and response into MongoDB or PostgreSQL"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
authors = [
    { name = "Kyriakos Fragkeskos" }
]
keywords = [
    "langgraph",
    "crewai",
    "observability",
    "monitoring",
    "llm",
    "genai",
    "agent",
    "tracing",
    "langchain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/KyriakosFrang/stakeout-agent"
Repository = "https://github.com/KyriakosFrang/stakeout-agent"
"Bug Tracker" = "https://github.com/KyriakosFrang/stakeout-agent/issues"

[project.optional-dependencies]
langgraph = ["langchain-core>=0.3", "langgraph>=1.1.9"]
mongodb = ["pymongo>=4.0"]
postgres = ["psycopg2-binary>=2.9"]
crewai = ["crewai>=0.80"]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]

[tool.hatch.build.targets.wheel]
packages = ["stakeout_agent"]


[tool.hatch.build.targets.sdist]
include = [
    "/stakeout_agent",
    "/tests",
    "/README.md",
    "/pyproject.toml"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
exclude = [
    "examples/*",
]
line-length = 120
indent-width = 4


[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
